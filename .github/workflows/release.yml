name: Release

# Cutting a release was entirely manual, which is why the published releases
# fell nine months behind the code. Pushing a version tag now builds, tests and
# publishes one, so a release is a tag away rather than a checklist.
#
#   bun run release:tag       # tags the version in package.json and pushes it
#
# The Docker workflows already build images for `v*` tags, so the release notes
# and the images stay in step.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for (e.g. v2.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history so the generated notes can describe the range since the
          # previous tag rather than just the tagged commit.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and build
        run: bun run build

      - name: Run offline tests
        run: |
          bun run test:scraper-fetch
          bun run test:text-split
          bun run test:mirror-lag
          bun run test:polling
          bun run test:video-limits
          bun run test:account-health

      - name: Check the tag matches package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="v$(bun -e "console.log(require('./package.json').version)")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package.json version $version." >&2
            echo "Bump the version in package.json, or tag the matching commit." >&2
            exit 1
          fi
          echo "Releasing $tag"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
