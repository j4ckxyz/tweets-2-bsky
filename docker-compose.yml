services:
  tweets-2-bsky:
    # Built from this checkout rather than pulled from a registry, so what runs
    # is the code you have. Rebuild after `git pull` with:
    #   docker compose up -d --build
    # To use a prebuilt image instead, replace `build` with:
    #   image: ghcr.io/j4ckxyz/tweets-2-bsky:latest
    build:
      context: .
      dockerfile: Dockerfile
    image: tweets-2-bsky:local
    container_name: tweets-2-bsky
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TWEETS2BSKY_DATA_DIR: /app/data
    volumes:
      - tweets2bsky_data:/app/data

volumes:
  tweets2bsky_data:
    name: tweets2bsky_data
