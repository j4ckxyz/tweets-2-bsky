name: tweets-2-bsky

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tweets-2-bsky
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      TZ: ${TZ:-UTC}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
